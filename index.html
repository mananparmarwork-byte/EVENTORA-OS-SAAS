<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101D35" />
    <title>Eventora OS — Event & Banquet Operations</title>
    <meta name="description" content="Eventora OS: quotations, bookings, payments and professional billing for event venues." />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- first-load screen: React replaces it as soon as the app starts -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#101D35;font-family:Inter,system-ui,sans-serif">
        <img src="%BASE_URL%icon-512.png" width="84" height="84" alt="" style="border-radius:20px" />
        <div style="width:120px;height:3px;border-radius:3px;background:#243759;overflow:hidden"><div style="width:40%;height:100%;border-radius:3px;background:#6AA2FF;animation:bar-run 1.3s ease-in-out infinite"></div></div>
        <p style="margin:0;font-size:11px;letter-spacing:.22em;color:#A5B4CF;font-weight:600">LOADING EVENTORA OS</p>
      </div>
      <style>@keyframes bar-run{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
